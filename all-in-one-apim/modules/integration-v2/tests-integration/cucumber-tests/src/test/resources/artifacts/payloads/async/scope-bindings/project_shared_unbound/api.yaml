type: api
version: v4.7.0
data:
  name: '{{sbApiName}}'
  context: '/{{sbContext}}'
  version: 1.0.0
  provider: admin
  lifeCycleStatus: CREATED
  type: SSE
  transport:
   - http
   - https
  policies:
   - AsyncUnlimited
  securityScheme:
   - oauth2
  visibility: PUBLIC
  endpointConfig:
    endpoint_type: http
    production_endpoints:
      url: http://nodebackend:3021
    sandbox_endpoints:
      url: http://nodebackend:3021
  endpointImplementationType: ENDPOINT
  scopes:
   -
    scope:
      name: '{{sbSharedScope}}'
      displayName: '{{sbSharedScope}}'
      description: scope under test
      bindings: []
    shared: true
  operations:
   -
    target: /notifications
    verb: SUBSCRIBE
    authType: Application & Application User
    throttlingPolicy: Unlimited
    scopes:
     - '{{sbSharedScope}}'
