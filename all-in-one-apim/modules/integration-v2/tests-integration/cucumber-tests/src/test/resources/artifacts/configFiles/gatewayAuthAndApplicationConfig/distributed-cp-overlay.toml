# Distributed-CP configuration for the IntegrationV2-Distributed-GatewayAuthAndApplicationConfig block. Application
# sharing and application attributes are CP (devportal) settings; auth_header and backend JWT match the Gateway's.
# The encryption key is shared with the TM and Gateway, which read the CP's encrypted resident IdP keystore
# material from APIM_DB.

[apim.oauth_config]
auth_header = "Test-Custom-Header"

[apim.devportal]
enable_application_sharing = true
application_sharing_type = "default"
enable_empty_values_in_application_attributes = true

# --- Backend JWT: the gateway injects X-JWT-Assertion (carrying the application-attribute claims) towards the
# backend.
[apim.jwt]
enable = true
encoding = "base64"
claim_dialect = "http://wso2.org/claims"
header = "X-JWT-Assertion"
signing_algorithm = "SHA256withRSA"

# --- Application attributes. "External Reference Id" is required with no default, so every application create and
# update in this block carries it (create_apim_test_app_with_external_ref.json); "Optional attribute" may be empty and
# still surfaces in the backend JWT because enable_empty_values_in_application_attributes is on (see [apim.devportal]
# above). Production/Sandbox access required default to "Yes".
[[apim.devportal.application_attributes]]
required = true
hidden = false
name = "External Reference Id"
description = "External Reference Id"

[[apim.devportal.application_attributes]]
required = false
hidden = false
name = "Optional attribute"
description = "Description of Optional attribute"

[[apim.devportal.application_attributes]]
required = true
hidden = false
default = "Yes"
name = "Sandbox access required"
description = "Does this Application require access to APIs in the Sandbox environment ? (Yes or No)"

[[apim.devportal.application_attributes]]
required = true
hidden = false
default = "Yes"
name = "Production access required"
description = "Does this Application require access to APIs in the Production environment ? (Yes or No)"

[encryption]
key = "04cd2cfc3c200bba4e1b8c3a591e2131558b8250b25b32db747c47e7ab3055d5"
