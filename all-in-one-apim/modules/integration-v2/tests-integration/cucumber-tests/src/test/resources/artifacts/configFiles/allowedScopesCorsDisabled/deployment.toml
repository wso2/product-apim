# Dedicated gateway-global CORS-disabled overlay for AllowedScopesTestWithCorsDisabled parity, used by the
# distributed suite. testng-v2.xml carries the same keys in the is7txSecurityAudit overlay (SecurityAuditCorsDisabledAndSecretRotation block).
# Kept out of the shared mtlsWsCors block so its positive REST and WebSocket CORS assertions remain unchanged.
[oauth]
allowed_scopes = ["^device_.*", "openid", "scope1", "scope2"]

[apim.cors]
enable = false
allow_origins = "*"
allow_methods = ["GET", "PUT", "POST", "DELETE", "PATCH", "OPTIONS"]
allow_headers = ["authorization", "Access-Control-Allow-Origin", "Content-Type", "SOAPAction"]
