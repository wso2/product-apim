# Overlay for the IntegrationV2-SecurityAuditCorsDisabledAndSecretRotation block (the publisher security-audit runner,
# the AllowedScopesTestWithCorsDisabled runner, the consumer-secret rotation runner and the WebSocket catch-all proxy
# runner). The distributed twin uses the distributed-*-overlay.toml files
# beside this one.
#
# The three tables below are disjoint and mutually inert:
#   - The security-audit runner performs ZERO gateway invocations and creates no applications (it is publisher-plane
#     only: create, publish, then GET /apis/{id}/auditapi), so the gateway-global CORS, allowed-scopes and
#     client-secret keys cannot affect it.
#   - [security_audit] is inert for everything else in the container: ApisApiServiceImplUtils#getAuditReport has
#     exactly ONE product call site (the GET /apis/{id}/auditapi resource), and nothing in API create/update/publish
#     consults it. global=true is tenant SCOPING only, not an auto-audit switch.
#   - The CORS and allowed-scopes keys do not touch rotation: it invokes the gateway without an Origin header and
#     requests no scopes. The single-secret model does not touch the CORS-disabled runner: it takes its consumer
#     secret from the generate-keys response (unchanged between models) and never uses the /secrets endpoints.
# No runner mutates container-global runtime state.
#
# ---------------------------------------------------------------------------------------------
# From the former securityAudit/deployment.toml
# ---------------------------------------------------------------------------------------------
# Without a [security_audit] block the product's getSecurityAuditAttributesFromConfig() returns null and
# GET /apis/{id}/auditapi NPEs into a raw 500, so this table is the whole reason the feature can run.
#
# base_url points at the `am-auditApi-sample` Express mock baked into the node-app-server image
# (nodeapps/am-auditApi-sample, pm2 app on port 3002, network alias `nodebackend`) — hence initBackend is
# load-bearing for this runner. The mock speaks plain HTTP, which the product accepts: APIUtil
# .getHttpClient() short-circuits to a plain PlainConnectionSocketFactory for non-https schemes.
#
# api_token is echoed as the X-API-KEY header on all three outbound calls and collection_id as the `cid`
# multipart field on the create call. The mock checks neither, but the product requires both to be
# non-empty or it treats the feature as unconfigured and returns null.
[security_audit]
# Deliberately NOT UUID-shaped: a UUID-valued api_token beside a base_url is the canonical secret-scanner
# signature, and these are inert mock values (see above — the mock validates neither).
api_token = "mock-audit-api-token"
collection_id = "mock-audit-collection-id"
base_url = "http://nodebackend:3002/auditapi"
global = true

# ---------------------------------------------------------------------------------------------
# Legacy AllowedScopesTestWithCorsDisabled configuration
# ---------------------------------------------------------------------------------------------
# Gateway-global CORS disabled plus the allowed-scopes whitelist. The security-audit runner never invokes the gateway.
[oauth]
allowed_scopes = ["^device_.*", "openid", "scope1", "scope2"]

[apim.cors]
enable = false
allow_origins = "*"
allow_methods = ["GET", "PUT", "POST", "DELETE", "PATCH", "OPTIONS"]
allow_headers = ["authorization", "Access-Control-Allow-Origin", "Content-Type", "SOAPAction"]

# ---------------------------------------------------------------------------------------------
# Single-client-secret credential model (KeyManagerConsumerSecretRotationRunner, ApplicationRegenerateConsumerSecretTestCase)
# ---------------------------------------------------------------------------------------------
# With multiple client secrets disabled an application key mapping holds exactly ONE consumer secret and ROTATION
# replaces it in place. On default config POST /applications/{appId}/oauth-keys/{keyMappingId}/regenerate-secret
# answers 500 (900967), because AMDefaultKeyManagerImpl#getNewApplicationConsumerSecret passes
# Base64.getUrlEncoder().encodeToString(clientId) where keymanager-operations' /dcr/register/{clientId}/
# regenerate-consumer-secret documents the RAW client identifier; under this key the same call returns 200.
# Container-wide effects of this key (carbon-apimgt): the devportal /secrets endpoints answer "not supported"
# (ApplicationsApiServiceImpl), the consumer secret is no longer masked on key retrieve/update and the
# client-secret description/expiry additional properties are dropped (AMDefaultKeyManagerImpl). The multiple-secret
# model's behaviour stays on the KeyManager block in multiple_client_secrets.feature.
[oauth.multiple_client_secrets]
enable = false

# ---------------------------------------------------------------------------------------------
# GatewayWebSocketProxyCatchAllRunner (WebSocketProxyProfileTestCase). [[transport.ws.proxy_profile]] only
# routes the gateway's OUTBOUND WebSocket connections; no other runner in this block invokes a WebSocket API,
# so the proxy sees only this runner's traffic and its exact Squid CONNECT counts stay valid.
# ---------------------------------------------------------------------------------------------
# Tests bypass_hosts within a catch-all ws proxy profile. A single catch-all profile is loaded:
#
#   Profile — target_hosts = ["*"]: matches every backend hostname, including "nodebackend".
#             bypass_hosts contains "nodebackend", so the gateway bypasses Squid and connects
#             directly to the node WS echo backend.
#             A passing echo proves the bypass path was taken; no CONNECT is recorded in the Squid
#             access log (asserted via SquidProxyServer.getAnonConnectCount()).
#
# No specific profile is present — nodebackend falls through to this catch-all, which is the exact
# condition needed to test catch-all bypass_hosts behaviour in isolation from specific-profile bypass.

[[transport.ws.proxy_profile]]
target_hosts = ["*"]
proxy_host = "squid-proxy"
proxy_port = 3128
bypass_hosts = ["nodebackend"]
