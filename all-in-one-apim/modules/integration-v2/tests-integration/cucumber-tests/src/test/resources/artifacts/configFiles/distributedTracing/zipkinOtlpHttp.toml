# Feature-specific TOML overlay for the IntegrationV2-AnalyticsTracingZipkin block.
#
# Merged ON TOP of the shared `basic` overlay (which is itself merged onto the product distribution
# deployment.toml) via the block's `tomlExtraOverlayPath` parameter — so only the tracing keys live here.
#
# Why `name = "zipkin"` and not `name = "otlp"`:
#   ZipkinTelemetry composes the exporter endpoint from hostname + port and ignores
#   `OpenTelemetry.RemoteTracer.Protocol`, so the Zipkin v2 JSON path (POST /api/v2/spans) is configured
#   through the zipkin tracer rather than through the otlp tracer.
#
# Why `hostname` is the container ALIAS and not `localhost`:
#   ZipkinTelemetry builds the endpoint as "http://" + hostname + ":" + port. `localhost` inside the APIM
#   container is APIM itself, which would silently export nowhere. The alias is the collector on the block's
#   private network.
#
# `port = 9411` is Zipkin's single HTTP port (spans ingest + query API).

[apim.open_telemetry]
remote_tracer.enable = true
remote_tracer.name = "zipkin"
remote_tracer.hostname = "zipkin"
remote_tracer.port = 9411