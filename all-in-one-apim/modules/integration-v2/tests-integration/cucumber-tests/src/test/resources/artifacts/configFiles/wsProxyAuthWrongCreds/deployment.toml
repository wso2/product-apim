# Extra overlay for the IntegrationV2-WsProxyAuthWrongCreds block.
#
# Tests that the gateway is rejected by the authenticated Squid proxy when the proxy profile
# carries incorrect credentials. The profile matches "nodebackend" and points at squid-proxy:3129
# (the Basic-auth Squid instance), but the username/password are intentionally wrong.
#
# The gateway DOES send CONNECT to the authenticated Squid with these wrong credentials and is refused
# with 407, which Squid records as a denied CONNECT — so the authenticated access log receives ONE entry,
# not zero, and the anonymous one receives none. The test asserts the WS rejection, the gateway's own
# 407 reason, anon count = 0 and auth count = 1, which together distinguish this failure from a broken
# network, a wrong target host, or an API that was never routable in the first place.

[[transport.ws.proxy_profile]]
target_hosts = ["nodebackend"]
proxy_host = "squid-proxy"
proxy_port = 3129
proxy_username = "wronguser"
proxy_password = "wrongpass"
