# Extra overlay for the IntegrationV2-WsProxyAuthWrongCreds block.
#
# Tests that the gateway is rejected by the authenticated Squid proxy when the proxy profile
# carries incorrect credentials. The profile matches "nodebackend" and points at squid-proxy:3129
# (the Basic-auth Squid instance), but the username/password are intentionally wrong.
#
# Squid validates incoming CONNECT requests against its htpasswd file (testproxyuser:testproxypass).
# When the gateway sends Proxy-Authorization with the wrong credentials, Squid returns 407
# Proxy Authentication Required. The gateway cannot establish the CONNECT tunnel, so the WS
# upgrade is rejected. A CONNECT count of 1 in the authenticated proxy access log confirms that
# the proxy was reached and the rejection came from Squid (not a pre-proxy network failure).

[[transport.ws.proxy_profile]]
target_hosts = ["nodebackend"]
proxy_host = "squid-proxy"
proxy_port = 3129
proxy_username = "wronguser"
proxy_password = "wrongpass"
