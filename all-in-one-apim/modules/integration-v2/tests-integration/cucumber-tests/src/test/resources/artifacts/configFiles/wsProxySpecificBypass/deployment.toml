# Extra overlay for the IntegrationV2-WsProxySpecificBypass block.
#
# Tests bypass_hosts within a specific ws proxy profile. Two profiles are loaded:
#
#   Profile 1 — specific for "nodebackend": target_hosts contains "nodebackend" AND bypass_hosts
#               contains "nodebackend". The gateway matches the specific profile but bypass_hosts takes
#               precedence — the gateway connects directly to nodebackend without going through Squid.
#               A passing echo proves the bypass path was taken; no CONNECT is recorded in the Squid
#               access log (asserted via SquidProxyServer.getAnonConnectCount()).
#
#   Profile 2 — specific for "proxied\.backend\.test": no bypass_hosts. The gateway sends
#               CONNECT proxied.backend.test:3001 to Squid; Squid cannot resolve that hostname
#               (it does not exist on the Docker network), so the tunnel fails and the WS handshake
#               is rejected. The negative scenario asserts this rejection.

[[transport.ws.proxy_profile]]
target_hosts = ["nodebackend"]
proxy_host = "squid-proxy"
proxy_port = 3128
bypass_hosts = ["nodebackend"]

[[transport.ws.proxy_profile]]
target_hosts = ["proxied\\.backend\\.test"]
proxy_host = "squid-proxy"
proxy_port = 3128
