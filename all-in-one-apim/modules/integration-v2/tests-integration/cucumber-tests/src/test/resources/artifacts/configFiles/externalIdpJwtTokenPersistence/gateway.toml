# Distributed gateway overlay: preserve externalIdpJwt/deployment.toml behavior and enable token persistence here
# as well, so issued/revoked state is available to the gateway runtime.

[apim.jwt]
enable = true
encoding = "base64"
claim_dialect = "http://wso2.org/claims"
header = "X-JWT-Assertion"

[apim.jwt.gateway_generator]
excluded_claims = ["http://idp.org/claims/mobileno"]

[oauth.token_persistence]
enable = true
