# Distributed TM delta from the product ZIP default. Runtime values are supplied by the composite container.

[server]
# Allow the integration framework to perform a bounded, ordered recovery after repairing
# registry-backed throttle-data infrastructure.
enable_restart_from_api = true

[database.apim_db]
type = "mysql"
username = "wso2carbon"
password = "wso2carbon"
driver = "com.mysql.cj.jdbc.Driver"

[database.shared_db]
type = "mysql"
username = "wso2carbon"
password = "wso2carbon"
driver = "com.mysql.cj.jdbc.Driver"

[apim.event_hub]
enable = true
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"
