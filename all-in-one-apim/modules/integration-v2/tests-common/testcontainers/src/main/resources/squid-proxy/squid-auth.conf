# Authenticated HTTP CONNECT proxy — port 3129.
# Requires Proxy-Authorization: Basic testproxyuser:testproxypass.
# Used by [[transport.ws.proxy_profile]] tests to verify that the gateway sends the correct
# credentials when proxy_username and proxy_password are set in the profile.

http_port 3129
pid_filename /var/run/squid-auth.pid

# Logs — one file per instance so the test code can grep them independently.
access_log /var/log/squid/auth-access.log squid
cache_log  /var/log/squid/auth-cache.log

# Basic auth via NCSA htpasswd file (created at image build time).
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/htpasswd
auth_param basic realm "WSO2 Test Proxy"
auth_param basic children 5 startup=0 idle=1

acl authenticated proxy_auth REQUIRED

# Allow CONNECT to any port for authenticated users only; deny everyone else.
acl all_ports port 0-65535
http_access allow authenticated
http_access deny all

# Separate coredump and cache dirs from the anon instance.
coredump_dir /var/cache/squid-auth
cache_dir ufs /var/cache/squid-auth 10 4 16

# Disable response caching.
cache deny all
cache_mem 0 MB
