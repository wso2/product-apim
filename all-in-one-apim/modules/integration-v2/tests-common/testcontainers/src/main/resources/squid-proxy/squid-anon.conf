# Anonymous HTTP CONNECT proxy — port 3128.
# No Proxy-Authorization required. All CONNECT targets are allowed regardless of port.
# Used by [[transport.ws.proxy_profile]] tests to verify that the gateway routes WS backend
# connections through an HTTP proxy without credentials.

http_port 3128
pid_filename /var/run/squid-anon.pid

# Logs — one file per instance so the test code can grep them independently.
access_log /var/log/squid/anon-access.log squid
cache_log  /var/log/squid/anon-cache.log

# Allow CONNECT to any port, not just 443.
# Default Squid ACLs restrict CONNECT to SSL_ports (443) and Safe_ports.
# Override completely so the gateway can tunnel to nodebackend:3001 (plain WS).
acl all_ports port 0-65535
http_access allow all

# Separate coredump and cache dirs from the auth instance.
coredump_dir /var/cache/squid-anon
cache_dir ufs /var/cache/squid-anon 10 4 16

# Disable response caching — tests need deterministic pass-through behaviour.
cache deny all
cache_mem 0 MB
