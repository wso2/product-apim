# Distributed Universal Gateway delta from the product ZIP default. Runtime values are final.
[server]
hostname = "apim-gw"

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://mysql:3306/WSO2AM_SHARED_DB?autoReconnect=true&amp;allowPublicKeyRetrieval=true&amp;useSSL=false"
username = "wso2carbon"
password = "wso2carbon"
driver = "com.mysql.cj.jdbc.Driver"

[apim.key_manager]
service_url = "https://apim-cp:9443/services/"

[apim.event_hub]
enable = true
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"
service_url = "https://apim-cp:9443/services/"
event_listening_endpoints = ["tcp://apim-cp:5672"]

[apim.sync_runtime_artifacts.gateway]
gateway_labels = ["Default"]

[apim.throttling]
throttle_decision_endpoints = ["tcp://apim-tm:5672"]

[[apim.throttling.url_group]]
traffic_manager_urls = ["tcp://apim-tm:9611"]
traffic_manager_auth_urls = ["ssl://apim-tm:9711"]
