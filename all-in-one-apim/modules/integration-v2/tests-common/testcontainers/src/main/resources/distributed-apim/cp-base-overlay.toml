# Distributed CP delta from the product ZIP default. Runtime values are final.
[server]
hostname = "apim-cp"

[database.apim_db]
type = "mysql"
url = "jdbc:mysql://mysql:3306/WSO2AM_DB?autoReconnect=true&amp;allowPublicKeyRetrieval=true&amp;useSSL=false"
username = "wso2carbon"
password = "wso2carbon"
driver = "com.mysql.cj.jdbc.Driver"

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://mysql:3306/WSO2AM_SHARED_DB?autoReconnect=true&amp;allowPublicKeyRetrieval=true&amp;useSSL=false"
username = "wso2carbon"
password = "wso2carbon"
driver = "com.mysql.cj.jdbc.Driver"

[apim.event_hub]
enable = true
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"
service_url = "https://apim-cp:9443/services/"
event_listening_endpoints = ["tcp://apim-cp:5672"]

[[apim.event_hub.publish.url_group]]
urls = ["tcp://apim-tm:9611"]
auth_urls = ["ssl://apim-tm:9711"]

[[apim.gateway.environment]]
name = "Default"
type = "hybrid"
gateway_type = "Regular"
provider = "wso2"
display_in_api_console = true
description = "This is a hybrid gateway that handles both production and sandbox token traffic."
show_as_token_endpoint_url = true
service_url = "https://apim-gw:9443/services/"
username = "${admin.username}"
password = "${admin.password}"
# These are the public virtual-host values stored in APIM metadata. They intentionally remain localhost;
# service_url above is the private Docker alias used for CP-to-Gateway administration.
ws_endpoint = "ws://localhost:9099"
wss_endpoint = "wss://localhost:8099"
http_endpoint = "http://localhost:8280"
https_endpoint = "https://localhost:8243"
