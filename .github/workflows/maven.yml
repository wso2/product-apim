name: APIM builder

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    branches:
      - master
concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - id: 1
            segment: group1
          - id: 2
            segment: group2
          - id: 3
            segment: group3
          - id: 4
            segment: group4
      fail-fast: false
    steps:
    - name: Run hostname
      run: hostname
    - name: Fix host entry
      run: sudo echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
    - name: Show hosts
      run: cat /etc/hosts
    - name: Checkout master
      uses: actions/checkout@v3
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2
        restore-keys: ${{ runner.os }}-m2
    - name: Set up JDK 21
      uses: actions/setup-java@v2
      with:
        java-version: 21
        distribution: 'temurin'
    - uses: actions/setup-node@v1
      with:
        node-version: '10.x'
    - name: Build product-apim with Test.
      run: mvn clean install --file all-in-one-apim/pom.xml -DskipBenchMarkTest=true -DskipRestartTests=true
      env:
        PRODUCT_APIM_TEST_GROUPS: ${{ matrix.segment }}
    - name: Prepare upload testng report
      if: always()
      run: mv all-in-one-apim/modules/integration/tests-integration/tests-backend/target/surefire-reports/TEST-TestSuite.xml TEST-TestSuite_${{ matrix.id }}.xml
    - name: Archive testng report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TEST-TestSuite_${{ matrix.id }}
        path: |
          TEST-TestSuite_${{ matrix.id }}.xml
        if-no-files-found: warn
    # jacoco<millis>.exec holds every server JVM's session; jacoco-data-merge.exec misses the last one.
    - name: Wait for the server JVM to write its coverage
      if: always()
      run: |
        for _ in $(seq 1 120); do
          pgrep -f 'jacocoagent.jar=destfile=' >/dev/null || exit 0
          sleep 1
        done
        echo "::warning::A server JVM with the JaCoCo agent is still running; its coverage session may be missing."
    - name: Archive legacy coverage execution data
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: legacy-coverage-exec-${{ matrix.id }}
        path: |
          all-in-one-apim/modules/integration/tests-integration/tests-backend/target/jacoco/jacoco*.exec
          !all-in-one-apim/modules/integration/tests-integration/tests-backend/target/jacoco/jacoco-data-merge.exec
        retention-days: 3
        if-no-files-found: warn
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        flags: integration_tests
  run-benchmark-test:
    runs-on: ubuntu-latest
    steps:
      - name: Run hostname
        run: hostname
      - name: Fix host entry
        run: sudo echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
      - name: Show hosts
        run: cat /etc/hosts
      - name: Checkout master
        uses: actions/checkout@v3
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2
          restore-keys: ${{ runner.os }}-m2
      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: 21
          distribution: 'temurin'
      - uses: actions/setup-node@v3
        with:
          node-version: '10.x'
      - name: Build product-apim with Test.
        run: mvn clean install -U --file all-in-one-apim/pom.xml -DskipIntegrationTests=true
  show-report:
    if: ${{ always() && !cancelled() }}
    needs: build
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Publish Test Report
        if: always()
        uses: malinthaprasan/action-surefire-report@v1
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        with:
          report_paths: 'reports/**/TEST-*.xml'
  # Builds the distribution + Docker images ONCE, then shares the non-public images (docker save ->
  # artifact), the testcontainers target/is7 and distributed-apim staging (image defaults + schemas,
  # produced by the same pre-integration-test execs), and the Maven repo (run-scoped cache) with the
  # integration-v2 matrix. The execs bind to pre-integration-test, which `mvn install` runs but `mvn test`
  # does not - so matrix entries `docker load` the images and unpack the staging, and never rebuild either.
  # Public IS and Solace broker images are not shipped; Testcontainers pulls them on demand.
  v2-build-images:
    runs-on: ubuntu-latest
    # Least privilege for GITHUB_TOKEN: this job only checks out sources (cache and artifact upload use the
    # Actions runtime token, not GITHUB_TOKEN).
    permissions:
      contents: read
    steps:
      - name: Run hostname
        run: hostname
      - name: Fix host entry
        run: sudo echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
      - name: Checkout
        uses: actions/checkout@v4
      # Placed before the image build so a broken v2 taxonomy fails in seconds, and integration-v2 (which needs
      # this job) never starts.
      - name: Lint integration-v2 scenario tags
        working-directory: all-in-one-apim/modules/integration-v2
        run: python3 docs/devs/render_coverage_tree.py
      # The lint step rewrites coverage-tree.md in place, so a diff means it was committed stale.
      - name: Verify coverage-tree.md was regenerated
        working-directory: all-in-one-apim/modules/integration-v2
        run: |
          if ! git diff --quiet -- docs/devs/coverage-tree.md; then
            echo "::error file=all-in-one-apim/modules/integration-v2/docs/devs/coverage-tree.md::Stale coverage tree. Run 'python3 docs/devs/render_coverage_tree.py' from all-in-one-apim/modules/integration-v2 and commit the regenerated file."
            git --no-pager diff -- docs/devs/coverage-tree.md
            exit 1
          fi
      - name: Verify carbon-apimgt versions are consistent
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          pom_paths = [
              pathlib.Path("all-in-one-apim/pom.xml"),
              pathlib.Path("api-control-plane/pom.xml"),
              pathlib.Path("gateway/pom.xml"),
              pathlib.Path("traffic-manager/pom.xml"),
          ]
          versions = {}
          for pom_path in pom_paths:
              root = ET.parse(pom_path).getroot()
              properties = next(
                  (element for element in root if element.tag.rsplit("}", 1)[-1] == "properties"),
                  None,
              )
              version = None
              if properties is not None:
                  for element in properties:
                      if element.tag.rsplit("}", 1)[-1] == "carbon.apimgt.version":
                          version = (element.text or "").strip()
                          break
              if not version:
                  raise SystemExit(f"::error file={pom_path}::carbon.apimgt.version is missing or blank")
              versions[str(pom_path)] = version

          distinct_versions = set(versions.values())
          if len(distinct_versions) != 1:
              print("::error file=all-in-one-apim/pom.xml::Inconsistent carbon.apimgt.version across APIM distributions. "
                    "Update the four distribution POMs to the same version before building images.")
              print("Detected carbon.apimgt.version values:")
              for pom_path, version in versions.items():
                  print(f"  {pom_path}: {version}")
              raise SystemExit(1)
          print(f"carbon.apimgt.version is consistent across all distributions: {next(iter(distinct_versions))}")
          PY
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      # Run-scoped key so the matrix restores exactly this run's repo (incl. the 4.7.0-SNAPSHOT artifacts the
      # dist build installs); restore-keys warm-starts from the shared cache.
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-v2-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-m2
      - name: Resolve APIM product versions
        run: |
          echo "APIM_VERSION=$(mvn -q -f all-in-one-apim/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          echo "CP_VERSION=$(mvn -q -f api-control-plane/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          echo "TM_VERSION=$(mvn -q -f traffic-manager/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          echo "GATEWAY_VERSION=$(mvn -q -f gateway/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
      - name: Build APIM distributions (skip tests)
        run: >
          mvn clean install
          -Dmaven.test.skip=true -DskipBenchMarkTest=true -DskipRestartTests=true
          -Dapim.server.version="$APIM_VERSION"
          -Ddistributed.apim.cp.image.name="distributed-apim-cp:${CP_VERSION}-jdk21"
          -Ddistributed.apim.tm.image.name="distributed-apim-tm:${TM_VERSION}-jdk21"
          -Ddistributed.apim.gateway.image.name="distributed-apim-gateway:${GATEWAY_VERSION}-jdk21"
      - name: Build integration Docker images (no suite)
        working-directory: all-in-one-apim/modules/integration-v2
        run: >
          mvn install -Pinclude-distributed-images -pl tests-integration/cucumber-tests -am -DskipTests
          -Dapim.server.version="$APIM_VERSION"
          -Ddistributed.apim.cp.image.name="distributed-apim-cp:${CP_VERSION}-jdk21"
          -Ddistributed.apim.tm.image.name="distributed-apim-tm:${TM_VERSION}-jdk21"
          -Ddistributed.apim.gateway.image.name="distributed-apim-gateway:${GATEWAY_VERSION}-jdk21"
          -Ddocker.extra.hosts="--add-host=host.docker.internal:host-gateway"
      # Resolve image names from the same pom properties used by the build.
      - name: Resolve Docker image names
        working-directory: all-in-one-apim/modules/integration-v2
        run: |
          echo "APIM_IMAGE=$(mvn -q -N help:evaluate -Dexpression=apim.docker.image.name -Dapim.server.version="$APIM_VERSION" -DforceStdout)" >> "$GITHUB_ENV"
          echo "SOLACE_SHIM_IMAGE=$(mvn -q -N help:evaluate -Dexpression=solace.shim.docker.image.name -DforceStdout)" >> "$GITHUB_ENV"
          echo "SQUID_IMAGE=$(mvn -q -N help:evaluate -Dexpression=squid.docker.image.name -DforceStdout)" >> "$GITHUB_ENV"
          echo "DISTRIBUTED_CP_IMAGE=distributed-apim-cp:${CP_VERSION}-jdk21" >> "$GITHUB_ENV"
          echo "DISTRIBUTED_TM_IMAGE=distributed-apim-tm:${TM_VERSION}-jdk21" >> "$GITHUB_ENV"
          echo "DISTRIBUTED_GATEWAY_IMAGE=distributed-apim-gateway:${GATEWAY_VERSION}-jdk21" >> "$GITHUB_ENV"
      # Only locally built images travel by tar; public images are pulled by the matrix.
      - name: Save Docker images and IS staging
        run: |
          mkdir -p /tmp/v2-images
          docker save \
            "$APIM_IMAGE" \
            "$DISTRIBUTED_CP_IMAGE" \
            "$DISTRIBUTED_TM_IMAGE" \
            "$DISTRIBUTED_GATEWAY_IMAGE" \
            node-app-server:latest \
            "$SOLACE_SHIM_IMAGE" \
            "$SQUID_IMAGE" | gzip > /tmp/v2-images/images.tar.gz
          # The external-KM blocks read these staged files at runtime (see BlockLifecycleListener /
          # DynamicApimContainer#withExternalKmTrust); they exist only where pre-integration-test ran.
          tar -C all-in-one-apim/modules/integration-v2/tests-common/testcontainers/target -czf \
            /tmp/v2-images/is7-staging.tar.gz is7
          tar -C all-in-one-apim/modules/integration-v2/tests-common/testcontainers/target -czf \
            /tmp/v2-images/distributed-apim-staging.tar.gz distributed-apim/defaults
      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: v2-images
          path: /tmp/v2-images/
          # 3 days so a failed-only re-run of integration-v2 within a few days still finds the prebuilt images
          retention-days: 3
          if-no-files-found: error
  integration-v2:
    needs: v2-build-images
    runs-on: ubuntu-latest
    # Least privilege for GITHUB_TOKEN, scoped per-job: checkout is read-only; 
    # checks: write is the single write the surefire-report action needs to publish its check run
    # (cache/artifacts use the runtime token; the Codecov upload does not use GITHUB_TOKEN).
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: v2-all-in-one
            suite: testng-v2.xml
            coverage: true
            topology: all-in-one
          # Temporarily disabled while investigating distributed-topology CI failures.
          # - id: v2-distributed
          #   suite: testng-v2_distributed.xml
          #   coverage: false
          #   topology: distributed
    steps:
      - name: Run hostname
        run: hostname
      - name: Fix host entry
        run: sudo echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Restore Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-v2-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-m2
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: v2-images
          path: /tmp/v2-images
      - name: Load Docker images
        run: docker load < /tmp/v2-images/images.tar.gz
      - name: Resolve APIM product versions
        run: |
          echo "APIM_VERSION=$(mvn -q -f all-in-one-apim/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          echo "CP_VERSION=$(mvn -q -f api-control-plane/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          echo "TM_VERSION=$(mvn -q -f traffic-manager/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
          echo "GATEWAY_VERSION=$(mvn -q -f gateway/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"
      # The IS-booting blocks fail fast without the pre-integration-test staging (truststores, IS default
      # toml, notification jar), and `mvn test` deliberately never runs those execs - restore the builder's.
      - name: Restore IS staging (target/is7)
        run: |
          mkdir -p all-in-one-apim/modules/integration-v2/tests-common/testcontainers/target
          tar -C all-in-one-apim/modules/integration-v2/tests-common/testcontainers/target -xzf \
            /tmp/v2-images/is7-staging.tar.gz
      - name: Restore distributed image defaults (target/distributed-apim/defaults)
        run: |
          mkdir -p all-in-one-apim/modules/integration-v2/tests-common/testcontainers/target
          tar -C all-in-one-apim/modules/integration-v2/tests-common/testcontainers/target -xzf \
            /tmp/v2-images/distributed-apim-staging.tar.gz
      # Pull the all-in-one product class files out of the already-loaded image instead of shipping the ~538 MB distribution
      # zip (docker cp is a LOCAL copy — zero extra artifact transfer). The image is what ran, so its classes are
      # byte-identical to the executed ones → exact JaCoCo class-id match. Distributed coverage is intentionally
      # unsupported because its CP, TM, and Gateway JVMs are separate products and are not collected by this lane.
      - name: Extract APIM class files from image (for coverage report)
        if: matrix.coverage
        working-directory: all-in-one-apim/modules/integration-v2
        run: |
          APIM_IMAGE=$(mvn -q -N help:evaluate -Dexpression=apim.docker.image.name -DforceStdout)
          APIM_SERVER_NAME=$(mvn -q -N help:evaluate -Dexpression=apim.server.name -DforceStdout)
          SRC="$RUNNER_TEMP/cov-classfiles"
          mkdir -p "$SRC"
          cid=$(docker create "$APIM_IMAGE")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          BASE="/home/wso2carbon/$APIM_SERVER_NAME/repository"
          docker cp "$cid:$BASE/components/plugins"        "$SRC/plugins"
          docker cp "$cid:$BASE/deployment/server/webapps" "$SRC/webapps"
          echo "APIM_COVERAGE_CLASSFILES=$SRC" >> "$GITHUB_ENV"
      # `mvn test` (not install) keeps the testcontainers pre-integration-test execs from firing, so the
      # loaded images and the restored target/is7 staging are reused. `-am` builds only the integration-v2
      # reactor deps up to the test phase; product 4.7.0-SNAPSHOT artifacts resolve from the restored repo.
      - name: Run all-in-one integration-v2 suite
        if: matrix.topology == 'all-in-one'
        working-directory: all-in-one-apim/modules/integration-v2
        run: >
          mvn test -pl tests-integration/cucumber-tests -am
          -Dsurefire.suite.xml=${{ matrix.suite }}
          -Dapim.server.version="$APIM_VERSION"
          -Ddistributed.apim.cp.image.name="distributed-apim-cp:${CP_VERSION}-jdk21"
          -Ddistributed.apim.tm.image.name="distributed-apim-tm:${TM_VERSION}-jdk21"
          -Ddistributed.apim.gateway.image.name="distributed-apim-gateway:${GATEWAY_VERSION}-jdk21"
          -Dplaywright.sso=true
          -Dapim.coverage=true
          -Dapim.coverage.classfiles="$APIM_COVERAGE_CLASSFILES"
          -Ddocker.extra.hosts="--add-host=host.docker.internal:host-gateway"
      - name: Run distributed integration-v2 suite (coverage intentionally disabled)
        if: matrix.topology == 'distributed'
        working-directory: all-in-one-apim/modules/integration-v2
        run: >
          mvn test -pl tests-integration/cucumber-tests -am
          -Dsurefire.suite.xml=${{ matrix.suite }}
          -Dapim.server.version="$APIM_VERSION"
          -Ddistributed.apim.cp.image.name="distributed-apim-cp:${CP_VERSION}-jdk21"
          -Ddistributed.apim.tm.image.name="distributed-apim-tm:${TM_VERSION}-jdk21"
          -Ddistributed.apim.gateway.image.name="distributed-apim-gateway:${GATEWAY_VERSION}-jdk21"
          -Dplaywright.sso=true
          -Ddocker.extra.hosts="--add-host=host.docker.internal:host-gateway"
      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-v2-reports-${{ matrix.id }}
          path: |
            all-in-one-apim/modules/integration-v2/tests-integration/cucumber-tests/target/surefire-reports/**
            all-in-one-apim/modules/integration-v2/tests-integration/cucumber-tests/target/cucumber-report/**
            all-in-one-apim/modules/integration-v2/tests-integration/cucumber-tests/target/logs/**
            all-in-one-apim/modules/integration-v2/tests-integration/cucumber-tests/target/coverage/output/**
          if-no-files-found: warn
      # Guard against a silent all-in-one coverage regression. Distributed coverage is intentionally excluded.
      - name: Verify coverage report was generated
        if: matrix.coverage
        run: |
          REPORT=all-in-one-apim/modules/integration-v2/tests-integration/cucumber-tests/target/coverage/output/txt/jacoco-it.xml
          # Check validity, not mere existence: -s rejects a 0-byte file, and the grep for the LINE counter
          # rejects a truncated/partial XML that never reached the bundle summary (either would sail through
          # a plain `-f` and then upload an empty report to Codecov).
          if [ ! -s "$REPORT" ] || ! grep -q '<counter type="LINE"' "$REPORT"; then
            echo "::error::Coverage report missing, empty, or malformed at $REPORT — coverage did not render correctly (check the image-classfiles extraction step and that the suite ran with -Dapim.coverage=true)."
            exit 1
          fi
          echo "Coverage report present and valid ($(wc -c <"$REPORT") bytes)"
          # A block whose block-end dump is missing contributed nothing, yet the merged report still looks valid.
          SUMMARY=all-in-one-apim/modules/integration-v2/tests-integration/cucumber-tests/target/coverage/output/txt/coverage-summary.properties
          if [ ! -s "$SUMMARY" ]; then
            echo "::error::Coverage dump summary missing at $SUMMARY — cannot confirm every block was dumped."
            exit 1
          fi
          expected=$(sed -n 's/^blocks\.expected=//p' "$SUMMARY")
          dumped=$(sed -n 's/^blocks\.dumped=//p' "$SUMMARY")
          missing=$(sed -n 's/^blocks\.missing=//p' "$SUMMARY")
          restarts=$(sed -n 's/^restart\.dumps=//p' "$SUMMARY")
          if [ -z "$expected" ] || [ "$expected" != "$dumped" ] || [ -n "$missing" ]; then
            echo "::error::Coverage dumped ${dumped:-?} of ${expected:-?} blocks; missing: ${missing:-unknown}. Their counters are absent from the report."
            exit 1
          fi
          # A failed pre-restart dump loses the counters of the JVM being restarted, even when the block-end dump of
          # the same block succeeds. A missing key fails too, so a summary without the tally cannot pass.
          failedRestarts=$(sed -n 's/^restart\.dumps\.failed=//p' "$SUMMARY")
          failedRestartList=$(sed -n 's/^restart\.dumps\.failedList=//p' "$SUMMARY")
          if [ "$failedRestarts" != "0" ]; then
            echo "::error::Coverage lost ${failedRestarts:-an unknown number of} pre-restart dump(s): ${failedRestartList:-unknown}. The counters of those restarted JVMs are absent from the report."
            exit 1
          fi
          echo "Coverage dumps: $dumped/$expected blocks, $restarts pre-restart dump(s)"
      - name: Upload v2 integration coverage to Codecov
        if: ${{ always() && matrix.coverage }}
        uses: codecov/codecov-action@v5
        with:
          files: all-in-one-apim/modules/integration-v2/tests-integration/cucumber-tests/target/coverage/output/txt/jacoco-it.xml
          flags: integration-v2_tests
      # Surface the actual scenario failures (name + assertion message) at the top of the run as a check +
      # annotations, so a red build is diagnosable without expanding logs. Same action the legacy show-report
      # job uses; the v2 surefire XML is standard Surefire JUnit, so it parses identically.
      - name: Publish v2 test report
        if: always()
        uses: malinthaprasan/action-surefire-report@v1
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        with:
          report_paths: 'all-in-one-apim/modules/integration-v2/tests-integration/cucumber-tests/target/surefire-reports/TEST-*.xml'
          check_name: 'integration-v2 results'
  # Legacy integration coverage rendered by the integration-v2 coverage report (same class files and exclusions).
  legacy-coverage-report:
    needs: [build, v2-build-images]
    if: ${{ always() && !cancelled() && needs.v2-build-images.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # build job matrix ids
      LEGACY_GROUP_IDS: 1 2 3 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Restore Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-v2-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-m2
      - name: Download legacy coverage execution data
        uses: actions/download-artifact@v4
        with:
          pattern: legacy-coverage-exec-*
          path: ${{ runner.temp }}/legacy-exec
      - name: Verify every legacy group uploaded execution data
        run: |
          missing=""
          for id in $LEGACY_GROUP_IDS; do
            dir="$RUNNER_TEMP/legacy-exec/legacy-coverage-exec-$id"
            if ! find "$dir" -name '*.exec' -size +0 2>/dev/null | grep -q .; then
              missing="$missing $id"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::No legacy coverage execution data for group(s):$missing"
            exit 1
          fi
          find "$RUNNER_TEMP/legacy-exec" -name '*.exec' -exec ls -l {} +
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: v2-images
          path: /tmp/v2-images
      - name: Load Docker images
        run: docker load < /tmp/v2-images/images.tar.gz
      - name: Extract APIM class files from image
        working-directory: all-in-one-apim/modules/integration-v2
        run: |
          APIM_IMAGE=$(mvn -q -N help:evaluate -Dexpression=apim.docker.image.name -DforceStdout)
          APIM_SERVER_NAME=$(mvn -q -N help:evaluate -Dexpression=apim.server.name -DforceStdout)
          SRC="$RUNNER_TEMP/cov-classfiles"
          mkdir -p "$SRC"
          cid=$(docker create "$APIM_IMAGE")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          BASE="/home/wso2carbon/$APIM_SERVER_NAME/repository"
          docker cp "$cid:$BASE/components/plugins"        "$SRC/plugins"
          docker cp "$cid:$BASE/deployment/server/webapps" "$SRC/webapps"
          echo "APIM_COVERAGE_CLASSFILES=$SRC" >> "$GITHUB_ENV"
      - name: Build the coverage report tool
        working-directory: all-in-one-apim/modules/integration-v2
        run: |
          mvn -B -q -pl tests-common/testcontainers -am -DskipTests compile
          mvn -B -q -pl tests-common/testcontainers dependency:build-classpath \
            -Dmdep.outputFile="$RUNNER_TEMP/coverage-classpath.txt"
      - name: Render legacy coverage report
        working-directory: all-in-one-apim/modules/integration-v2
        run: >
          java -cp "tests-common/testcontainers/target/classes:$(cat "$RUNNER_TEMP/coverage-classpath.txt")"
          org.wso2.am.testcontainers.CoverageReportCli
          --exec "$RUNNER_TEMP/legacy-exec"
          --classfiles-dir "$APIM_COVERAGE_CLASSFILES"
          --out "$RUNNER_TEMP/legacy-coverage"
          --title legacy-integration
      - name: Summarize legacy coverage
        if: always()
        run: |
          SUMMARY="$RUNNER_TEMP/legacy-coverage/coverage-summary.properties"
          if [ ! -s "$SUMMARY" ]; then
            echo "No legacy coverage summary was produced; see the Render legacy coverage report step." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$SUMMARY" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys
          values = {}
          with open(sys.argv[1], encoding="utf-8") as f:
              for line in f:
                  key, _, value = line.rstrip("\n").partition("=")
                  values[key] = value
          print("### Legacy integration coverage")
          print()
          print(f"Execution data files: {values['exec.files']}, sessions: {values['sessions']}, "
                f"classes with mismatched execution data: {values['nomatch.count']}")
          print()
          print("| Counter | Covered | Total | % |")
          print("|---|---:|---:|---:|")
          for name in ("line", "instruction", "branch", "method", "class"):
              covered, total = int(values[f"{name}.covered"]), int(values[f"{name}.total"])
              pct = 100.0 * covered / total if total else 0.0
              print(f"| {name} | {covered} | {total} | {pct:.2f} |")
          PY
      - name: Archive legacy coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-coverage-report
          path: |
            ${{ runner.temp }}/legacy-coverage/xml/**
            ${{ runner.temp }}/legacy-coverage/html/**
            ${{ runner.temp }}/legacy-coverage/coverage-summary.properties
          if-no-files-found: warn
